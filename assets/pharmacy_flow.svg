<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 1320" width="860" height="1320" role="img" aria-label="Flow chart: Smart Pharmacy Inventory &amp; Sales Management System">
<title>Flow chart: Smart Pharmacy Inventory &amp; Sales Management System</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="860" height="1320" fill="#ffffff"/>
<rect x="640" y="16" width="18" height="14" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="666" y="27.2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="start">Input</text>
<rect x="640" y="38" width="18" height="14" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="666" y="49.2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="start">Decision / loop</text>
<rect x="640" y="60" width="18" height="14" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="666" y="71.2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="start">Success</text>
<rect x="640" y="82" width="18" height="14" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="666" y="93.2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="start">Error / rejection</text>
<rect x="640" y="104" width="18" height="14" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="666" y="115.2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="start">Warning</text>
<rect x="640" y="126" width="18" height="14" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
<text x="666" y="137.2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="start">Process</text>
<rect x="225.0" y="16.0" width="150" height="40" rx="20.0" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="300" y="40.9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Start</text>
<rect x="140.0" y="84.0" width="320" height="52" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="300" y="114.9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#0f172a" text-anchor="middle">Input: number of medicines</text>
<polyline points="300,56 300,84" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/>
<polygon points="300,160.0 420.0,200 300,240.0 180.0,200" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="300" y="204.6" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#0f172a" text-anchor="middle">Count ≥ 1?</text>
<polyline points="300,136 300,160" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/>
<rect x="535.0" y="175.0" width="210" height="50" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="640" y="195.9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#0f172a" text-anchor="middle">Print error,</text>
<text x="640" y="213.9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#0f172a" text-anchor="middle">ask again</text>
<polyline points="420,200 535,200" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/>
<text x="478" y="191" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#dc2626" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">No</text>
<polyline points="640,175 640,110 460,110" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/>
<text x="312" y="252" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#16a34a" text-anchor="start" stroke="#ffffff" stroke-width="4" paint-order="stroke">Yes</text>
<rect x="100.0" y="269.0" width="400" height="58" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
<text x="300" y="294.2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#0f172a" text-anchor="middle">total_revenue = 0.0 · processed = 0</text>
<text x="300" y="310.9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#0f172a" text-anchor="middle">restock_needed = 0</text>
<polyline points="300,240 300,269" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/>
<polygon points="300,359.0 450.0,405 300,451.0 150.0,405" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="300" y="401.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#0f172a" text-anchor="middle">More medicines?</text>
<text x="300" y="416.9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#0f172a" text-anchor="middle">for … in range(1, count+1)</text>
<polyline points="300,327 300,359" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/>
<text x="312" y="457" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#16a34a" text-anchor="start" stroke="#ffffff" stroke-width="4" paint-order="stroke">Yes</text>
<rect x="110.0" y="481.0" width="380" height="58" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="300" y="505.9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#0f172a" text-anchor="middle">Input: name, stock, price,</text>
<text x="300" y="523.9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#0f172a" text-anchor="middle">quantity sold</text>
<polyline points="300,451 300,481" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/>
<polygon points="300,570.0 425.0,610 300,650.0 175.0,610" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="300" y="614.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#0f172a" text-anchor="middle">Input valid?</text>
<polyline points="300,539 300,570" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/>
<rect x="535.0" y="585.0" width="210" height="50" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="640" y="605.9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#0f172a" text-anchor="middle">Print error,</text>
<text x="640" y="623.9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#0f172a" text-anchor="middle">ask again</text>
<polyline points="425,610 535,610" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/>
<text x="480" y="601" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#dc2626" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">No</text>
<polyline points="640,585 640,510 490,510" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/>
<text x="312" y="662" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#16a34a" text-anchor="start" stroke="#ffffff" stroke-width="4" paint-order="stroke">Yes</text>
<polygon points="300,677.0 435.0,722 300,767.0 165.0,722" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="300" y="726.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#0f172a" text-anchor="middle">quantity ≤ stock?</text>
<polyline points="300,650 300,677" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/>
<rect x="120.0" y="801.0" width="360" height="62" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="300" y="819.9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#0f172a" text-anchor="middle">Sale completed:</text>
<text x="300" y="836.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#0f172a" text-anchor="middle">amount = qty × price</text>
<text x="300" y="853.2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#0f172a" text-anchor="middle">remaining = stock − qty</text>
<text x="312" y="775" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#16a34a" text-anchor="start" stroke="#ffffff" stroke-width="4" paint-order="stroke">Yes</text>
<polyline points="300,767 300,801" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/>
<rect x="520.0" y="687.0" width="240" height="70" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="640" y="718.2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#0f172a" text-anchor="middle">Sale rejected:</text>
<text x="640" y="734.9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#0f172a" text-anchor="middle">amount = 0, remaining = stock</text>
<polyline points="435,722 520,722" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/>
<text x="478" y="713" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#dc2626" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">No</text>
<polyline points="640,757 640,885 300,885" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round"/>
<polygon points="300,913.0 435.0,958 300,1003.0 165.0,958" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="300" y="962.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#0f172a" text-anchor="middle">remaining &lt; 10?</text>
<polyline points="300,863 300,913" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/>
<rect x="520.0" y="928.0" width="240" height="60" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="640" y="953.9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#0f172a" text-anchor="middle">Print WARNING</text>
<text x="640" y="971.9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#0f172a" text-anchor="middle">restock_needed += 1</text>
<polyline points="435,958 520,958" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/>
<text x="478" y="949" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#d97706" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">Yes</text>
<text x="312" y="1010" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#16a34a" text-anchor="start" stroke="#ffffff" stroke-width="4" paint-order="stroke">No</text>
<rect x="120.0" y="1039.0" width="360" height="58" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
<text x="300" y="1064.2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#0f172a" text-anchor="middle">total_revenue += amount</text>
<text x="300" y="1080.9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#0f172a" text-anchor="middle">processed += 1</text>
<polyline points="300,1003 300,1039" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/>
<polyline points="640,988 640,1068 480,1068" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/>
<polyline points="120,1068 50,1068 50,405 150,405" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/>
<text x="60" y="740" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#475569" text-anchor="start" stroke="#ffffff" stroke-width="4" paint-order="stroke">next medicine</text>
<rect x="100.0" y="1161.0" width="400" height="58" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="300" y="1185.9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#0f172a" text-anchor="middle">Print report: processed,</text>
<text x="300" y="1203.9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#0f172a" text-anchor="middle">revenue, restock count</text>
<polyline points="450,405 815,405 815,1190 500,1190" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/>
<text x="630" y="396" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#16a34a" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">No (all done)</text>
<rect x="240.0" y="1267.0" width="120" height="36" rx="18.0" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="300" y="1289.9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">End</text>
<polyline points="300,1219 300,1267" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/>
</svg>