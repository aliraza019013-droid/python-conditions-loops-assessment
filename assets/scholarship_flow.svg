<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 910" width="780" height="910" role="img" aria-label="Flow chart: Student Scholarship Eligibility System">
<title>Flow chart: Student Scholarship Eligibility System</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="780" height="910" fill="#ffffff"/>
<rect x="470" y="8" width="18" height="14" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="496" y="19.2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="start">Input</text>
<rect x="470" y="26" width="18" height="14" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="496" y="37.2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="start">Decision / loop</text>
