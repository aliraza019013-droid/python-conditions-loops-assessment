<text x="496" y="91.2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="start">Warning</text>
<rect x="470" y="98" width="18" height="14" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
<text x="496" y="109.2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="start">Process</text>
