<text x="250" y="120.9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#0f172a" text-anchor="middle">Input: name, marks %,</text>
<text x="250" y="138.9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#0f172a" text-anchor="middle">attendance %, family income</text>
<polyline points="250,60 250,97" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/>
<polygon points="250,190.0 375.0,235 250,280.0 125.0,235" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="250" y="231.2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#0f172a" text-anchor="middle">Input valid?</text>
<text x="250" y="247.9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#0f172a" text-anchor="middle">(letters / number range)</text>
<polyline points="250,153 250,190" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/>
<rect x="480.0" y="207.0" width="220" height="56" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
