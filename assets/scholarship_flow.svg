<polyline points="660,207 660,125 430,125" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/>
<text x="262" y="288" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#16a34a" text-anchor="start" stroke="#ffffff" stroke-width="4" paint-order="stroke">Yes</text>
<rect x="60.0" y="315.0" width="380" height="60" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
<text x="250" y="341.2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#0f172a" text-anchor="middle">Check each rule:</text>
<text x="250" y="357.9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#0f172a" text-anchor="middle">marks ≥ 80 · attendance ≥ 85 · income ≤ 50,000</text>
<polyline points="250,280 250,315" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/>
<polygon points="250,412.0 395.0,460 250,508.0 105.0,460" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="250" y="464.6" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#0f172a" text-anchor="middle">Any rule failed?</text>
<polyline points="250,375 250,412" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/>
<rect x="475.0" y="425.0" width="230" height="70" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="590" y="455.9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#0f172a" text-anchor="middle">Not Eligible</text>
<text x="590" y="473.9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#0f172a" text-anchor="middle">print reason(s)</text>
<polyline points="395,460 475,460" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/>
<text x="435" y="451" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#dc2626" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">Yes</text>
<text x="262" y="520" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#16a34a" text-anchor="start" stroke="#ffffff" stroke-width="4" paint-order="stroke">No</text>
<polyline points="250,508 250,545" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/>
<polygon points="250,550.0 380.0,595 250,640.0 120.0,595" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="250" y="599.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#0f172a" text-anchor="middle">marks ≥ 90?</text>
<rect x="475.0" y="567.0" width="230" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="590" y="599.9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#0f172a" text-anchor="middle">Full Scholarship</text>
<polyline points="380,595 475,595" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/>
<text x="428" y="586" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#16a34a" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">Yes</text>
<text x="262" y="655" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#dc2626" text-anchor="start" stroke="#ffffff" stroke-width="4" paint-order="stroke">No</text>
<polyline points="250,640 250,672" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/>
<rect x="130.0" y="672.0" width="240" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="250" y="704.9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#0f172a" text-anchor="middle">Partial Scholarship</text>
<rect x="110.0" y="774.0" width="280" height="52" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
<text x="250" y="804.9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#0f172a" text-anchor="middle">Print scholarship result</text>
<polyline points="250,728 250,774" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/>
<polyline points="590,623 590,800 390,800" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/>
<polyline points="705,460 745,460 745,800 590,800" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round"/>
<rect x="190.0" y="860.0" width="120" height="36" rx="18.0" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="250" y="882.9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">End</text>
<polyline points="250,826 250,860" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/>
