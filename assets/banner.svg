<circle cx="640" cy="55" r="5" fill="#ef4444"/>
<circle cx="658" cy="55" r="5" fill="#f59e0b"/>
<circle cx="676" cy="55" r="5" fill="#22c55e"/>
<text x="800" y="58.9" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle">scholarship / pharmacy</text>
<text x="640" y="90" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="12.5" xml:space="preserve"><tspan fill="#c084fc">if </tspan><tspan fill="#e2e8f0">reasons:</tspan></text>
<text x="640" y="111" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="12.5" xml:space="preserve"><tspan fill="#c084fc">    return </tspan><tspan fill="#86efac">False, "None", reasons</tspan></text>
<text x="640" y="132" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="12.5" xml:space="preserve"><tspan fill="#c084fc">elif </tspan><tspan fill="#e2e8f0">marks &gt;= FULL_SCHOLARSHIP_MARKS:</tspan></text>
<text x="640" y="153" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="12.5" xml:space="preserve"><tspan fill="#c084fc">    return </tspan><tspan fill="#86efac">True, "Full Scholarship"</tspan></text>
<text x="640" y="174" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="12.5" xml:space="preserve"><tspan fill="#c084fc">for </tspan><tspan fill="#e2e8f0">number </tspan><tspan fill="#c084fc">in </tspan><tspan fill="#60a5fa">range</tspan><tspan fill="#e2e8f0">(1, count + 1):</tspan></text>
<text x="640" y="195" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="12.5" xml:space="preserve"><tspan fill="#e2e8f0">    total_revenue += amount</tspan></text>
